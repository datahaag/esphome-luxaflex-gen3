esphome:
  name: luxaflex_ble_analyzer
  friendly_name: Luxaflex BLE Analyzer

esp32:
  board: m5stack-atom-echo
  framework:
    type: esp-idf

logger:
  level: VERY_VERBOSE

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 320ms
    window: 300ms
